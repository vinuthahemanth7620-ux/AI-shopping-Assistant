<div class="custom-card p-3 mb-4">
    <h6 class="fw-bold mb-3"><i class="fa-solid fa-filter text-primary me-2"></i>Filter Categories</h6>
    <div class="list-group list-group-flush">
        <a href="{{ url_for('product.list_products', category='laptops') }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
            <span><i class="fa-solid fa-laptop me-2 text-secondary"></i> Laptops</span>
            <span class="badge bg-light text-dark rounded-pill">3</span>
        </a>
        <a href="{{ url_for('product.list_products', category='mobiles') }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
            <span><i class="fa-solid fa-mobile-screen-button me-2 text-secondary"></i> Mobiles</span>
            <span class="badge bg-light text-dark rounded-pill">3</span>
        </a>
        <a href="{{ url_for('product.list_products', category='headphones') }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
            <span><i class="fa-solid fa-headphones me-2 text-secondary"></i> Headphones</span>
            <span class="badge bg-light text-dark rounded-pill">3</span>
        </a>
        <a href="{{ url_for('product.list_products', category='smart-watches') }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
            <span><i class="fa-solid fa-stopwatch me-2 text-secondary"></i> Smart Watches</span>
            <span class="badge bg-light text-dark rounded-pill">2</span>
        </a>
    </div>

    <h6 class="fw-bold mt-4 mb-3"><i class="fa-solid fa-tag text-primary me-2"></i>Price Range</h6>
    <div class="mb-3">
        <input type="range" class="form-range" min="1000" max="200000" step="5000" id="priceRange">
        <div class="d-flex justify-content-between text-muted small">
            <span>₹1,000</span>
            <span>₹2,00,000</span>
        </div>
    </div>
</div>
