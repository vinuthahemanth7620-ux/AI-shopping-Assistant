<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Shopping Assistant - Password Reset OTP</title>
    <style>
        body { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; background-color: #f1f3f6; margin: 0; padding: 20px; color: #212121; }
        .email-container { max-width: 580px; margin: 0 auto; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid #e0e0e0; }
        .email-header { background-color: #2874f0; padding: 25px 30px; text-align: center; color: #ffffff; }
        .email-header h1 { margin: 0; font-size: 24px; font-weight: 700; font-family: 'Outfit', sans-serif; letter-spacing: 0.5px; }
        .email-header span { color: #ffe500; font-style: italic; }
        .email-body { padding: 30px; }
        .greeting { font-size: 16px; font-weight: 600; color: #212121; margin-top: 0; }
        .text { font-size: 14px; color: #555555; line-height: 1.6; }
        .otp-box { text-align: center; background-color: #f8f9fa; border: 2px dashed #2874f0; border-radius: 10px; padding: 20px; margin: 25px 0; }
        .otp-code { font-size: 36px; font-weight: 800; letter-spacing: 10px; color: #2874f0; font-family: 'Courier New', monospace; }
        .timer-warning { text-align: center; font-size: 12px; color: #856404; background-color: #fff3cd; padding: 8px 15px; border-radius: 20px; display: inline-block; margin-top: 15px; border: 1px solid #ffeeba; }
        .security-note { background-color: #f8f9fa; border-left: 4px solid #6c757d; padding: 12px 15px; font-size: 13px; color: #666; margin-top: 25px; border-radius: 0 6px 6px 0; }
        .email-footer { background-color: #172337; color: #878787; padding: 20px; text-align: center; font-size: 12px; }
    </style>
</head>
<body>
    <div class="email-container">
        <!-- Header -->
        <div class="email-header">
            <h1>Shop<span>AI</span> Security</h1>
        </div>

        <!-- Body -->
        <div class="email-body">
            <p class="greeting">Hello {{ user_name or 'User' }},</p>
            <p class="text">Your password reset code is:</p>

            <!-- OTP Box -->
            <div class="otp-box">
                <div class="otp-code">{{ otp_code }}</div>
                <div class="timer-warning">&#x23F1; This code is valid for <strong>10 minutes</strong>.</div>
            </div>

            <!-- Security Note -->
            <div class="security-note">
                If you did not request this, ignore this email.
            </div>
        </div>

        <!-- Footer -->
        <div class="email-footer">
            <p>&copy; {{ year or 2026 }} AI Shopping Assistant Team.</p>
        </div>
    </div>
</body>
</html>
