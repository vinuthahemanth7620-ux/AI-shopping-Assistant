{% extends 'base.html' %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="my-4">
        <i class="fa-solid fa-triangle-exclamation text-danger display-1"></i>
    </div>
    <h1 class="fw-bold mb-3">500 - Internal Server Error</h1>
    <p class="lead text-muted mb-4">Something went wrong on our servers. Our team is looking into it.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary-custom px-4 py-2">
        <i class="fa-solid fa-house me-2"></i> Return to Home
    </a>
</div>
{% endblock %}
