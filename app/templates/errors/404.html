{% extends 'base.html' %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="my-4">
        <i class="fa-solid fa-compass-drafting text-primary display-1"></i>
    </div>
    <h1 class="fw-bold mb-3">404 - Page Not Found</h1>
    <p class="lead text-muted mb-4">The page you are searching for does not exist or has been moved.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary-custom px-4 py-2">
        <i class="fa-solid fa-house me-2"></i> Return to Home
    </a>
</div>
{% endblock %}
