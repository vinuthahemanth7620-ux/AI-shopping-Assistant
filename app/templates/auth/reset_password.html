{% extends 'base.html' %}

{% block title %}Reset Password - AI Shopping Assistant{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <!-- Header Banner -->
                <div class="p-4 text-center text-white" style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);">
                    <div class="rounded-circle bg-white bg-opacity-20 d-inline-flex p-3 mb-2">
                        <i class="fa-solid fa-key fs-2 text-white"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Set New Password</h3>
                    <p class="text-white opacity-90 small mb-0">Create a new secure password for your account</p>
                </div>

                <!-- Card Body -->
                <div class="card-body p-4 p-md-5 bg-white">
                    <form action="{{ url_for('auth.reset_password') }}" method="POST" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        
                        <!-- New Password Input -->
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold text-dark">New Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="fa-solid fa-lock"></i>
                                </span>
                                <input type="password" class="form-control border-start-0 border-end-0 ps-0 bg-light" id="password" name="password" 
                                       placeholder="At least 6 characters" required autofocus>
                                <button class="btn btn-light border border-start-0 text-muted" type="button" id="togglePassword">
                                    <i class="fa-solid fa-eye" id="toggleIcon"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Confirm New Password Input -->
                        <div class="mb-4">
                            <label for="confirm_password" class="form-label fw-semibold text-dark">Confirm New Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="fa-solid fa-shield-halved"></i>
                                </span>
                                <input type="password" class="form-control border-start-0 ps-0 bg-light" id="confirm_password" name="confirm_password" 
                                       placeholder="Re-enter new password" required>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-success w-100 py-3 fw-bold rounded-3 shadow-sm text-uppercase text-white">
                            <i class="fa-solid fa-floppy-disk me-2"></i> Update Password
                        </button>
                    </form>
                </div>

                <!-- Footer Link -->
                <div class="card-footer bg-light p-3 text-center border-0">
                    <p class="mb-0 text-muted small">
                        Back to 
                        <a href="{{ url_for('auth.login') }}" class="text-success fw-bold text-decoration-none ms-1">
                            Sign In Page
                        </a>
                    </p>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Password Visibility Toggle Script
    document.getElementById('togglePassword')?.addEventListener('click', function() {
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleIcon');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleIcon.classList.remove('fa-eye');
            toggleIcon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            toggleIcon.classList.remove('fa-eye-slash');
            toggleIcon.classList.add('fa-eye');
        }
    });
</script>
{% endblock %}
