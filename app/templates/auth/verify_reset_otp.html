{% extends 'base.html' %}

{% block title %}Verify Reset OTP - AI Shopping Assistant{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <!-- Header Banner -->
                <div class="p-4 text-center text-white" style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);">
                    <div class="rounded-circle bg-white bg-opacity-20 d-inline-flex p-3 mb-2">
                        <i class="fa-solid fa-shield-cat fs-2 text-white"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Verify OTP Code</h3>
                    <p class="text-white opacity-90 small mb-0">Enter the 6-digit code sent to your registered email</p>
                </div>

                <!-- Card Body -->
                <div class="card-body p-4 p-md-5 bg-white">
                    <form action="{{ url_for('auth.verify_reset_otp') }}" method="POST" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        
                        <!-- Registered Email Input -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold text-dark">Registered Email <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="fa-solid fa-envelope"></i>
                                </span>
                                <input type="email" class="form-control border-start-0 ps-0 bg-light" id="email" name="email" 
                                       placeholder="name@example.com" value="{{ email or '' }}" required autofocus>
                            </div>
                        </div>

                        <!-- OTP Code Input -->
                        <div class="mb-4">
                            <label for="otp" class="form-label fw-semibold text-dark">6-Digit OTP Code <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="fa-solid fa-key"></i>
                                </span>
                                <input type="text" class="form-control border-start-0 ps-0 bg-light fw-bold fs-5 text-center tracking-wider" 
                                       id="otp" name="otp" placeholder="123456" maxlength="6" pattern="[0-9]{6}" required>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-success w-100 py-3 fw-bold rounded-3 shadow-sm text-uppercase text-white">
                            <i class="fa-solid fa-check-double me-2"></i> Verify OTP Code
                        </button>
                    </form>
                </div>

                <!-- Footer Link -->
                <div class="card-footer bg-light p-3 text-center border-0">
                    <p class="mb-0 text-muted small">
                        Didn't receive the OTP? 
                        <a href="{{ url_for('auth.forgot_password') }}" class="text-success fw-bold text-decoration-none ms-1">
                            Resend Code
                        </a>
                    </p>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
